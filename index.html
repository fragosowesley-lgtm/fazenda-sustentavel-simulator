<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fazenda Sustentável Simulator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="telaInicial">

    <h1>🚜 Fazenda Sustentável Simulator</h1>

    <p>
        Administre sua fazenda, preserve o meio ambiente
        e alcance a máxima produtividade.
    </p>

    <button id="btnIniciar">
        INICIAR SIMULAÇÃO
    </button>

</div>

<div id="jogo" style="display:none;">

    <header>

        <h1>🌾 Painel da Fazenda</h1>

    </header>

    <div class="painel">

        <div class="indicador">
            <h3>💧 Água</h3>
            <div class="barra">
                <div id="agua"></div>
            </div>
        </div>

        <div class="indicador">
            <h3>🌳 Meio Ambiente</h3>
            <div class="barra">
                <div id="ambiente"></div>
            </div>
        </div>

        <div class="indicador">
            <h3>🌾 Produção</h3>
            <div class="barra">
                <div id="producao"></div>
            </div>
        </div>

        <div class="indicador">
            <h3>💰 Dinheiro</h3>
            <div class="barra">
                <div id="dinheiro"></div>
            </div>
        </div>

    </div>

    <div id="evento">

        <h2 id="pergunta"></h2>

        <button id="opcao1"></button>

        <button id="opcao2"></button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
